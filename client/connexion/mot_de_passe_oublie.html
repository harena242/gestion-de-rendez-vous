<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublié</title>
</head>
<body>
    <h1>Mot de passe oublié</h1>
    <p>Entrez votre adresse email : nous vous enverrons un code de vérification.</p>

    <p id="message" style="color: red;"></p>

    <form id="form-oubli" action="mot_de_passe_oublie.php" method="POST">
        <label for="email">Adresse email</label><br>
        <input type="email" id="email" name="email"><br><br>
        <button type="submit">Envoyer</button>
    </form>

    <p><a href="connexion.html">Retour à la connexion</a></p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("message");
        const resultat = params.get("resultat");

        if (resultat === "inconnu") {
            message.textContent = "Cette adresse email n'est pas enregistrée.";
        } else if (resultat === "erreur_mail") {
            message.textContent = "L'email n'a pas pu être envoyé. Réessayez.";
        } else if (resultat === "envoye") {
            message.style.color = "green";
            message.textContent = "Un code de vérification a été envoyé à votre adresse email.";
        }

        document.getElementById("form-oubli").addEventListener("submit", function (e) {
            if (document.getElementById("email").value.trim() === "") {
                e.preventDefault();
                message.style.color = "red";
                message.textContent = "Veuillez entrer votre adresse email.";
            }
        });
    </script>
</body>
</html>
